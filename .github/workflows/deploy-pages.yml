name: Deploy to GitHub Pages

# 本仓库是独立的单页应用：push 到 main 后自动
#   1) 跑单元测试（121+ 个用例，全部为纯函数数学验证）
#   2) 打包出自包含的单文件 HTML
#   3) 发布到 GitHub Pages
# 线上地址：https://leroy668.github.io/flop-trainer/

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check & unit tests
        run: npm test

      - name: Build single-file HTML
        run: npm run build:single

      - name: Prepare publish directory
        run: |
          mkdir -p pages-dist
          cp flop-trainer.html pages-dist/index.html
          cp flop-trainer.html pages-dist/flop-trainer.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./pages-dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
